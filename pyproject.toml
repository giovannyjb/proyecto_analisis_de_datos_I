[project]
name = "proyecto-analisis-de-datos-i"
version = "0.1.0"
description = "Taller 1 — EDA dengue SIVIGILA: predicción de brotes (Grupo 3)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "jupyterlab>=4.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "openpyxl>=3.1",
    "pyarrow>=15.0",
    "ipykernel>=6.29",
    "gdown>=6.1.0",
    "streamlit>=1.32",
    "plotly>=5.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
